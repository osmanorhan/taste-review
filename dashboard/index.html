<!doctype html><meta charset="utf-8"><title>taste</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
body{font:14px/1.4 -apple-system,system-ui,sans-serif;margin:0;display:grid;grid-template-columns:340px 1fr;height:100vh;color:#1f2937}
aside{border-right:1px solid #e5e7eb;overflow:auto}
aside div{padding:10px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer}
aside div.on{background:#eff6ff}
.s{font-size:11px;padding:1px 6px;border-radius:9px;color:#fff;margin-right:6px}
.running{background:#f59e0b}.queued{background:#94a3b8}.done{background:#3b82f6}.posted{background:#10b981}.failed{background:#ef4444}
.v{font-size:11px;color:#64748b}
main{overflow:auto;padding:20px 32px}
main img{max-width:100%;border:1px solid #e5e7eb;border-radius:6px}
button{padding:6px 12px;margin-right:8px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;cursor:pointer}
button.p{background:#10b981;color:#fff;border-color:#10b981}
code{background:#f1f5f9;padding:1px 4px;border-radius:3px}
table.m{font-size:12px;border-collapse:collapse;margin:8px 0;color:#475569}
table.m td{padding:3px 10px 3px 0;vertical-align:top}
table.m td:first-child{color:#94a3b8;white-space:nowrap}
</style>
<aside id="list"></aside><main id="main">Pick a PR.</main>
<script>
let data=[],cur=null;
const prs=d=>d.set?Object.values(d.prs):[d],key=d=>d.set?{set:d.set}:{repo:d.repo,number:d.number};
async function load(){data=await (await fetch('/api/list')).json();
 list.innerHTML=data.map((d,i)=>`<div class="${cur==i?'on':''}" onclick="show(${i})"><span class="s ${d.status}">${d.status}</span><b>${prs(d).map(p=>p.repo+'#'+p.number).join(' + ')}</b><br>${d.title||''}<br><span class="v">${d.questions!=null?(d.questions?d.questions+' questions':'nothing to ask'):''} · ${[...new Set(prs(d).map(p=>p.author))].join(', ')}</span></div>`).join('');
 if(cur!==null)render();}
function show(i){cur=i;load();}
async function model(repo){const m=await (await fetch('/api/model/'+repo)).json();cur=null;load();
 main.innerHTML=`<h2>${repo} — mental model</h2><p class=v>${m.history.length} changes: ${m.history.slice(0,5).join(' · ')}</p>${marked.parse(m.model||'_no model yet. First review bootstraps it._')}`;}
function render(){const d=data[cur];
 main.innerHTML=`<p>${prs(d).map(p=>`<a href="${p.url}" target=_blank>${p.url}</a> · <a href="#" onclick="model('${p.repo}');return false">mental model</a> · <code>${(p.sha||'').slice(0,7)}</code>`).join('<br>')}<br>${d.started||''}</p>
 <p>${Object.keys(d.comments).length?`<button class=p onclick="post()" ${d.status!=='done'?'disabled':''}>Approve → post to PR</button>`:'<i>Nothing to post.</i> '}<button onclick="rerun()">Re-run</button>
 ${d.excalidraw?`<a href="${d.excalidraw}" download>flow.excalidraw</a>`:''}${prs(d).filter(p=>p.posted_url).map(p=>` · posted: <a href="${p.posted_url}" target=_blank>${p.repo}#${p.number}</a>`).join('')}</p>
 ${d.error?`<pre style="color:#b91c1c">${d.error}</pre>`:''}
 ${Object.entries(d.comments).map(([r,c])=>`<details><summary>Goes to ${r}</summary>${marked.parse(c)}</details>`).join('')}
 ${d.set?Object.entries(d.metrics||{}).map(([r,m])=>`<b>${r}</b>`+metrics(m)).join(''):metrics(d.metrics)}
 ${marked.parse((d.review||'_no review yet_').replace('![flow](flow.png)',d.png?`![flow](${d.png})`:''))}`;}
function metrics(m){if(!m)return '';
 const rows=[];
 if(m.coverage)rows.push(['coverage',m.coverage]);
 if(m.read&&m.read.files<m.read.of)rows.push(['read','<b style="color:#b91c1c">'+m.read.files+' of '+m.read.of+' changed files</b>']);
 if((m.crap||[]).length)rows.push(['CRAP &gt; 30',m.crap.map(x=>`<b>${x.crap}</b> ${x.fn} · CCN ${x.ccn} · cov ${x.cov}%`).join('<br>')]);
 if((m.complexity||[]).length)rows.push(['complexity',m.complexity.map(x=>`${x.fn} · CCN ${x.ccn}${x.cog!=null?' · COG '+x.cog:''}`).join('<br>')]);
 return rows.length?`<table class=m>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`:'';}
async function post(){const d=data[cur];const r=await (await fetch('/api/approve',{method:'POST',body:JSON.stringify(key(d))})).json();alert(r.ok?'posted '+r.url:r.err);load();}
async function rerun(){const d=data[cur];await fetch('/api/rerun',{method:'POST',body:JSON.stringify(key(d))});load();}
load();setInterval(load,15000);
</script>
